<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESG Auditor Network | Offline Prototype</title>
<style>
:root{--green:#123d32;--green2:#32805d;--mint:#eaf3ed;--bg:#f4f7f4;--ink:#1d3028;--muted:#718078;--line:#e1e9e2;--white:#fff;--amber:#a97922;--blue:#426b91;--shadow:0 8px 28px #173d2a12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--green2);color:white;font-weight:650}button:hover{filter:brightness(.96)}button.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}button.ghost{background:transparent;color:var(--green);padding:7px}button.danger{background:#fff2f0;color:#a33;border:1px solid #f0d5d0}
.top{background:var(--green);color:#fff;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;gap:11px;align-items:center}.logo{height:40px;width:40px;border-radius:12px;background:#a6d9b8;color:var(--green);display:grid;place-items:center;font-size:23px}.brand strong{font-size:17px;letter-spacing:.3px}.brand small{display:block;color:#c9ded1;margin-top:2px}
.rolebox{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.rolebox label{font-size:12px;color:#d4e5da}.rolebox select{background:#28594b;color:white;border:1px solid #517969;border-radius:8px;padding:9px}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 72px)}aside{background:#fff;border-right:1px solid var(--line);padding:22px 14px}.navtitle{font-size:10px;font-weight:800;letter-spacing:1.1px;color:#8a9990;padding:0 10px 10px}
nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;color:#53645a;margin:3px 0;padding:11px 12px;font-weight:550}nav button.active{background:var(--mint);color:var(--green);font-weight:750}
main{padding:28px;max-width:1500px;width:100%;margin:auto}.heading{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:22px}.heading h1{font-size:27px;margin:0 0 5px;color:var(--green)}.muted{color:var(--muted)}.small{font-size:12px}.tag{display:inline-flex;align-items:center;border-radius:30px;padding:5px 9px;background:#edf2ee;color:#53665a;font-size:11px;font-weight:700}.tag.green{background:#e5f4e9;color:#247047}.tag.amber{background:#fff4df;color:#91671d}.tag.blue{background:#e9f1f8;color:#426b91}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.metric{font-size:30px;font-weight:800;color:var(--green);margin:12px 0 3px}.metric-icon{width:38px;height:38px;border-radius:11px;background:var(--mint);display:grid;place-items:center;font-size:19px}
.section{margin-top:24px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section h2,.card h2{font-size:17px;margin:0;color:var(--green)}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:13px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:13px 15px;border-bottom:1px solid var(--line);font-size:13px}th{color:#718078;background:#f8faf8;font-size:11px;text-transform:uppercase;letter-spacing:.6px}tr:last-child td{border-bottom:0}
.progress{height:8px;background:#e8eee9;border-radius:20px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:var(--green2);border-radius:20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.field{display:flex;flex-direction:column;gap:6px;margin:11px 0}.field label{font-size:12px;font-weight:700;color:#52645a}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dce5dd;border-radius:9px;padding:11px;background:#fff;color:var(--ink);min-width:0}.toolbar input{flex:1;min-width:180px}
.experts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.expert{display:flex;flex-direction:column;gap:12px}.expert-top{display:flex;align-items:center;gap:12px}.avatar{width:46px;height:46px;border-radius:50%;background:#e3f0e6;color:var(--green);display:grid;place-items:center;font-weight:800;font-size:16px}.expert-top .tag{margin-left:auto}.expert-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:auto}
.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{padding:30px;text-align:center;color:var(--muted)}.barrow{display:grid;grid-template-columns:120px 1fr 45px;align-items:center;gap:10px;margin:13px 0}.barrow .progress{margin:0}
.modalback{position:fixed;inset:0;background:#0b2019a8;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalback.show{display:flex}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:23px;box-shadow:0 20px 70px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0;color:var(--green)}.toast{position:fixed;right:20px;bottom:20px;background:var(--green);color:#fff;padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:20}.toast.show{display:block}
footer{padding:18px 28px;color:#809087;font-size:11px;text-align:center}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:190px minmax(0,1fr)}main{padding:22px}}
@media(max-width:650px){.top{padding:13px 16px}.layout{display:block}aside{padding:10px;border-right:0;border-bottom:1px solid var(--line);overflow:auto}nav{display:flex;gap:5px;min-width:max-content}nav button{width:auto;margin:0}.navtitle{display:none}main{padding:18px 14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:14px}.experts{grid-template-columns:1fr}.heading h1{font-size:23px}.metric{font-size:25px}.barrow{grid-template-columns:95px 1fr 38px;gap:6px}}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><div class="logo">♧</div><div><strong>ESG AUDITOR NETWORK</strong><small>Certified expertise for compliant, audit-ready sustainability reporting</small></div></div>
 <div class="rolebox"><label for="role">VIEW AS</label><select id="role"><option>Client</option><option>Auditor</option><option>Admin</option></select></div>
</header>
<div class="layout">
 <aside><div class="navtitle">WORKSPACE</div><nav id="nav"></nav></aside>
 <main id="app"></main>
</div>
<footer>ESG Auditor Network · Offline interactive MVP prototype · Sample data only · No live backend, payments or authentication</footer>
<div class="modalback" id="modalback"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const experts=[
{name:"Priya Sharma",skill:"Carbon Accounting",cert:"GHG Protocol",exp:"8 years",rating:"4.9",city:"Bengaluru",price:"₹8,000",verified:true,about:"Supports GHG inventories, Scope 1–3 measurement and emissions data quality."},
{name:"Rahul Mehta",skill:"ESG Compliance",cert:"GRI Certified",exp:"6 years",rating:"4.8",city:"Mumbai",price:"₹6,500",verified:true,about:"Helps organisations prepare regulatory disclosures and supporting evidence."},
{name:"Ananya Rao",skill:"ESG Reporting",cert:"Sustainability Reporting",exp:"10 years",rating:"5.0",city:"Hyderabad",price:"₹10,000",verified:true,about:"Specialist in reporting frameworks, stakeholder disclosures and materiality."},
{name:"Vikram Singh",skill:"Sustainability Strategy",cert:"ISO 14001",exp:"5 years",rating:"4.7",city:"Delhi",price:"₹7,000",verified:false,about:"Works on sustainability targets, improvement plans and environmental systems."},
{name:"Neha Kapoor",skill:"Assurance Readiness",cert:"ISO 14064",exp:"7 years",rating:"4.8",city:"Pune",price:"₹9,000",verified:true,about:"Prepares evidence trails, controls and documentation for independent review."},
{name:"Arjun Patel",skill:"Sector Specialists",cert:"Industry ESG",exp:"9 years",rating:"4.9",city:"Chennai",price:"₹8,500",verified:true,about:"Industry-focused ESG support for manufacturing and export businesses."}
];
let role="Client",page="Marketplace",bookings=[
{company:"ABC Manufacturing Ltd",type:"Carbon Accounting",auditor:"Priya Sharma",date:"08 Nov 2026",status:"Awaiting confirmation"},
{company:"GreenTech Solutions",type:"ESG Compliance",auditor:"Rahul Mehta",date:"10 Nov 2026",status:"Confirmed"},
{company:"EcoBuild Pvt Ltd",type:"ESG Reporting",auditor:"Ananya Rao",date:"12 Nov 2026",status:"Completed"}
],users=["ABC Manufacturing Ltd","GreenTech Solutions","Global Industries","EcoBuild Pvt Ltd"],approved=["Priya Sharma","Rahul Mehta","Ananya Rao","Neha Kapoor","Arjun Patel"];
const navs={Client:["Marketplace","My bookings","Company profile"],Auditor:["Dashboard","Booking requests","Availability","My profile"],Admin:["Dashboard","Verify auditors","Manage bookings","Users","Analytics"]};
const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2400)}
function statusTag(s){let c=s==="Completed"||s==="Confirmed"||s==="Approved"?"green":s==="Pending"||s==="Awaiting confirmation"?"amber":"blue";return `<span class="tag ${c}">${s}</span>`}
function setRole(v){role=v;page=navs[v][0];render()}
$("role").addEventListener("change",e=>setRole(e.target.value));
function setPage(v){page=v;render()}
function renderNav(){$("nav").innerHTML=navs[role].map(n=>`<button class="${page===n?"active":""}" onclick="setPage('${n}')"><span>${iconFor(n)}</span>${n}</button>`).join("")}
function iconFor(n){return ({Marketplace:"⌕","My bookings":"▤","Company profile":"▣",Dashboard:"▦","Booking requests":"▧",Availability:"◷","My profile":"♙","Verify auditors":"✓","Manage bookings":"▤",Users:"♧",Analytics:"▥"})[n]||"•"}
function head(title,sub,action=""){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${sub}</div></div>${action}</div>`}
function metric(icon,n,label){return `<div class="card"><div class="metric-icon">${icon}</div><div class="metric">${n}</div><div class="muted small">${label}</div></div>`}
function dashboard(){let title=role==="Admin"?"Platform overview":role==="Auditor"?"Auditor dashboard":"Company dashboard";let metrics=role==="Admin"?[["♙","248","Registered auditors"],["▣","87","Companies"],["✓","126","Completed projects"],["◷","34","Open bookings"]]:role==="Auditor"?[["▧","14","Assigned projects"],["✓","9","Completed"],["◷","3","In progress"],["▤","2","New requests"]]:[["♙","12","Matched professionals"],["▤",bookings.length,"Booking requests"],["✓","1","Completed projects"],["◷","1","Awaiting confirmation"]];
return head(title,"Your sustainability workspace · Overview")+`<div class="grid">${metrics.map(x=>metric(...x)).join("")}</div><div class="section"><div class="sectionhead"><h2>Marketplace activity</h2><span class="tag green">Illustrative data</span></div><div class="grid" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[["Environmental",82],["Social",74],["Governance",91]].map(([n,v])=>`<div class="card"><b>${n}</b><div class="metric">${v}%</div><div class="progress"><span style="width:${v}%"></span></div></div>`).join("")}</div></div><div class="section"><div class="sectionhead"><h2>Recent engagements</h2><button class="secondary" onclick="setPage('${role==="Client"?"Marketplace":"Manage bookings"}')">View all</button></div>${bookingTable(bookings.slice(0,3))}</div>`}
function bookingTable(rows){return `<div class="tablewrap"><table><thead><tr><th>Company / Project</th><th>Service</th><th>Auditor</th><th>Date</th><th>Status</th></tr></thead><tbody>${rows.map(b=>`<tr><td><b>${b.company}</b></td><td>${b.type}</td><td>${b.auditor}</td><td>${b.date}</td><td>${statusTag(b.status)}</td></tr>`).join("")||`<tr><td colspan="5">No records yet.</td></tr>`}</tbody></table></div>`}
function marketplace(){return head("Find your ESG expert","Discover, compare and engage qualified sustainability professionals.","<button onclick=\"openBooking()\">＋ Request consultation</button>")+`<div class="card"><div class="toolbar"><input id="search" placeholder="Search by name, expertise, certification or city..." oninput="filterExperts()"><select id="category" onchange="filterExperts()"><option>All services</option>${["Carbon Accounting","ESG Compliance","Sustainability Strategy","ESG Reporting","Assurance Readiness","Sector Specialists"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="muted small">Browse specialists by service, certification, sector and experience.</div></div><div class="section"><div class="sectionhead"><h2>Recommended professionals</h2><span class="tag green">Verified network</span></div><div class="experts" id="expertlist">${expertCards(experts)}</div></div>`}
function expertCards(list){return list.map(e=>`<div class="card expert"><div class="expert-top"><div class="avatar">${e.name.split(" ").map(x=>x[0]).join("")}</div><div><b>${e.name}</b><div class="muted small">${e.skill}</div></div>${e.verified?'<span class="tag green">✓ Verified</span>':'<span class="tag amber">Review</span>'}</div><div class="muted small">${e.city} · ${e.exp} experience</div><div class="muted small">Certification: ${e.cert} · ★ ${e.rating}</div><p class="small">${e.about}</p><div class="expert-foot"><b>${e.price}<span class="muted small"> / starting</span></b><button onclick="openBooking('${e.name}')">View & book</button></div></div>`).join("")||'<div class="empty">No matching professionals. Try another search.</div>'}
function filterExperts(){let q=($("search")?.value||"").toLowerCase(),c=$("category")?.value||"All services";$("expertlist").innerHTML=expertCards(experts.filter(e=>(e.name+" "+e.skill+" "+e.cert+" "+e.city).toLowerCase().includes(q)&&(c==="All services"||e.skill===c)))}
function openBooking(name=""){let e=experts.find(x=>x.name===name)||experts[0];$("modal").innerHTML=`<div class="modalhead"><h2>Request a consultation</h2><button class="ghost" onclick="closeModal()">✕</button></div><p class="muted small">Share your project needs. The auditor can confirm the engagement.</p><form onsubmit="submitBooking(event)"><div class="field"><label>Company / organisation</label><input name="company" required placeholder="Your company name" value="ABC Manufacturing Ltd"></div><div class="field"><label>Service required</label><select name="type">${["Carbon Accounting","ESG Compliance","Sustainability Strategy","ESG Reporting","Assurance Readiness","Sector Specialists"].map(x=>`<option ${x===e.skill?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Preferred auditor</label><select name="auditor">${experts.map(x=>`<option ${x.name===e.name?"selected":""}>${x.name}</option>`).join("")}</select></div><div class="field"><label>Preferred date</label><input name="date" type="date" required></div><div class="field"><label>Project details</label><textarea name="details" rows="3" placeholder="Describe your requirements..."></textarea></div><button type="submit">Send consultation request</button></form>`;$("modalback").classList.add("show")}
function closeModal(){$("modalback").classList.remove("show")}
function submitBooking(ev){ev.preventDefault();let f=new FormData(ev.target);bookings.unshift({company:f.get("company"),type:f.get("type"),auditor:f.get("auditor"),date:f.get("date"),status:"Awaiting confirmation"});closeModal();toast("Consultation request added to your bookings.");render()}
function myBookings(){return head("My bookings","Track consultation requests and project engagements.")+bookingTable(bookings)}
function companyProfile(){return head("Company profile","Manage your organisation details.")+`<div class="card"><form onsubmit="event.preventDefault();toast('Company profile saved in this browser session.')"><div class="field"><label>Organisation name</label><input required value="ABC Manufacturing Ltd"></div><div class="field"><label>Industry</label><input value="Manufacturing"></div><div class="field"><label>Location</label><input value="Bengaluru, India"></div><div class="field"><label>Company website</label><input placeholder="https://"></div><button>Save profile</button></form></div>`}
function auditorProfile(){return head("Professional profile","Keep your expertise and credentials up to date.")+`<div class="card"><form onsubmit="event.preventDefault();toast('Profile saved in this browser session.')"><div class="field"><label>Full name</label><input value="Priya Sharma"></div><div class="field"><label>Primary service</label><select>${["Carbon Accounting","ESG Compliance","Sustainability Strategy","ESG Reporting","Assurance Readiness","Sector Specialists"].map(x=>`<option>${x}</option>`).join("")}</select></div><div class="field"><label>Certifications</label><input value="GHG Protocol"></div><div class="field"><label>Years of experience</label><input value="8"></div><div class="field"><label>Professional summary</label><textarea rows="4">Supports GHG inventories, Scope 1–3 measurement and emissions data quality.</textarea></div><button>Save profile</button></form></div>`}
function availability(){return head("Availability calendar","Publish the days and times you can accept projects.")+`<div class="card"><h2>Weekly availability</h2>${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map((d,i)=>`<label style="display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)">${d}<input type="checkbox" ${i<5?"checked":""}></label>`).join("")}<div class="field"><label>Working hours</label><input value="09:00 – 17:00"></div><button onclick="toast('Availability saved in this browser session.')">Publish availability</button></div>`}
function requests(){let rows=[{company:"ABC Manufacturing Ltd",type:"Carbon Accounting",auditor:"Priya Sharma",date:"08 Nov 2026",status:"Pending"},{company:"EcoBuild Pvt Ltd",type:"ESG Compliance",auditor:"Priya Sharma",date:"10 Nov 2026",status:"Pending"}];return head("Booking requests","Review new client enquiries and respond to opportunities.")+rows.map((b,i)=>`<div class="card section"><div class="sectionhead"><h2>${b.company}</h2>${statusTag(approved.includes("request"+i)?"Confirmed":"Pending")}</div><p class="muted small">${b.type} · ${b.date}</p><div class="actions"><button onclick="approved.push('request${i}');toast('Request accepted.');render()">Accept project</button><button class="danger" onclick="toast('Request declined in demo.')">Decline</button></div></div>`).join("")}
function verify(){let pending=["Vikram Singh","Neha Kapoor","Arjun Patel"];return head("Auditor verification","Review professional credentials before granting marketplace approval.")+`<div class="section"><div class="experts">${pending.map((n,i)=>`<div class="card"><div class="expert-top"><div class="avatar">${n.split(" ").map(x=>x[0]).join("")}</div><b>${n}</b></div><p class="muted small">Credential: ${["ISO 14001","GHG Protocol","Industry ESG"][i]}</p><span class="tag amber">Awaiting review</span><div class="actions"><button onclick="approved.push('${n}');toast('${n} approved in demo.');render()">Approve</button><button class="danger" onclick="toast('Marked for further review.')">Request changes</button></div></div>`).join("")}</div></div>`}
function adminBookings(){return head("Manage bookings","Monitor all client–auditor engagements.")+bookingTable(bookings)}
function usersPage(){return head("User management","Manage companies and professionals on the network.")+`<div class="tablewrap"><table><thead><tr><th>User</th><th>Account type</th><th>Status</th></tr></thead><tbody>${users.map(x=>`<tr><td>${x}</td><td>Company</td><td>${statusTag("Active")}</td></tr>`).join("")}${experts.map(x=>`<tr><td>${x.name}</td><td>Auditor</td><td>${statusTag(approved.includes(x.name)?"Approved":"Pending")}</td></tr>`).join("")}</tbody></table></div>`}
function analytics(){return head("Platform analytics","High-level marketplace activity and engagement indicators.")+`<div class="grid">${metric("♙","248","Registered auditors")}${metric("▣","87","Companies")}${metric("▤",bookings.length,"Bookings in sample")}${metric("✓","126","Completed engagements")}</div><div class="section card"><h2>Service demand mix</h2>${[["Carbon Accounting",78],["ESG Compliance",65],["ESG Reporting",58],["Sustainability Strategy",42],["Assurance Readiness",35]].map(([n,v])=>`<div class="barrow"><span class="small">${n}</span><div class="progress"><span style="width:${v}%"></span></div><b>${v}%</b></div>`).join("")}</div>`}
function render(){renderNav();let html="";if(page==="Dashboard")html=dashboard();else if(page==="Marketplace")html=marketplace();else if(page==="My bookings"||page==="Manage bookings")html=myBookings();else if(page==="Company profile")html=companyProfile();else if(page==="My profile")html=auditorProfile();else if(page==="Availability")html=availability();else if(page==="Booking requests")html=requests();else if(page==="Verify auditors")html=verify();else if(page==="Users")html=usersPage();else if(page==="Analytics")html=analytics();$("app").innerHTML=html}
render();
</script>
</body></html>
